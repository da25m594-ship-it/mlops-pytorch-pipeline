model:
  architecture: small_cnn
  num_classes: 10

training:
  epochs: 2
  batch_size: 32
  learning_rate: 0.001
  num_workers: 0
  early_stopping_patience: 1

data:
  dataset: cifar10
  data_dir: /app/data
  train_samples: 1000
  val_samples: 200

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier.pt
